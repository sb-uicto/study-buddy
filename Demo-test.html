<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Study Buddy - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

      tailwind.config = {

          extend: {
            "colors": {
                    "on-error-container": "#93000a",
                    "surface-dim": "#d8dadd",

                    "on-secondary-fixed-variant": "#4f00d0",
                    "tertiary": "#001d2f",
                    "surface-tint": "#4c56af",
                    "primary-fixed-dim": "#bdc2ff",
                    "on-primary-container": "#8690ee",
                    "tertiary-fixed": "#cae6ff",
                    "secondary-container": "#7c4dff",
                    "surface-bright": "#f7f9fc",
                    "on-tertiary-fixed": "#001e30",
                    "error": "#ba1a1a",
                    "on-background": "#191c1e",
                    "error-container": "#ffdad6",
                    "inverse-surface": "#2d3133",
                    "on-secondary": "#ffffff",
                    "outline-variant": "#c6c5d4",
                    "primary-fixed": "#e0e0ff",
                    "on-error": "#ffffff",
                    "primary": "#000666",
                    "on-tertiary": "#ffffff",
                    "primary-container": "#1a237e",
                    "secondary-fixed-dim": "#cdbdff",
                    "secondary": "#632ce5",
                    "surface-container-high": "#e6e8eb",
                    "inverse-primary": "#bdc2ff",
                    "on-tertiary-container": "#00a0e9",
                    "on-secondary-container": "#fcf6ff",
                    "surface": "#f7f9fc",
                    "on-primary-fixed-variant": "#343d96",
                    "outline": "#767683",
                    "inverse-on-surface": "#eff1f4",
                    "surface-variant": "#e0e3e6",
                    "tertiary-fixed-dim": "#8dcdff",
                    "on-primary": "#ffffff",
                    "on-primary-fixed": "#000767",
                    "surface-container": "#eceef1",
                    "on-surface-variant": "#454652"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "sm": "8px",
                    "lg": "24px",
                    "gutter": "20px",
                    "container-max": "1280px",
                    "unit": "4px",
                    "md": "16px",
                    "xs": "4px",
                    "margin-mobile": "16px",
                    "xl": "48px"
            },
            "fontFamily": {
                    "h1": [
                            "Lexend"
                    ],
                    "button": [
                            "Inter"
                    ],
                    "body-lg": [
                            "Inter"
                    ],
                    "h3": [
                            "Lexend"
                    ],
                    "h2": [
                            "Lexend"
                    ],
                    "label-caps": [
                            "Inter"
                    ],
                    "body-md": [
                            "Inter"
                    ]
            },
            "fontSize": {
                    "h1": [
                            "40px",
                            {
                                    "lineHeight": "1.2",
                                    "letterSpacing": "-0.02em",
                                    "fontWeight": "700"
                            }
                    ],
                    "button": [
                            "14px",
                            {

                            }
                    ],
                    "body-lg": [
                            "18px",

                                    "fontWeight": "400"
                            }
                    ],
                    "h3": [
                            "24px",
                            {
                                    "lineHeight": "1.4",
                                    "fontWeight": "600"
                            }
                    ],
                    "h2": [
                            "32px",
                            {
                                    "lineHeight": "1.3",
                                    "letterSpacing": "-0.01em",
                                    "fontWeight": "600"

                    ],
                    "label-caps": [
                            "12px",
                            {
                                    "lineHeight": "1.0",
                                    "letterSpacing": "0.05em",
                                    "fontWeight": "700"
                            }
                    ],
                    "body-md": [
                            "16px",
                            {
                                    "lineHeight": "1.6",
                                    "fontWeight": "400"
                            }
                    ]
            }
    },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen font-body-md text-on-surface antialiased flex flex-col items-center justify-center p-margin-mobile">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_rgba(26,35,126,0.05)] border border-[#E8EAF6] overflow-hidden flex flex-col relative min-h-[600px]">
<!-- Header area -->
<div class="px-lg pt-xl pb-md text-center">
<h1 class="font-h2 text-h2 text-primary mb-sm">Let's get started</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Step 1 of 3: Select your Faculty</p>
</div>
<!-- Progress Indicator -->
<div class="px-lg mb-lg">
<div class="w-full bg-surface-container-high h-2 rounded-full overflow-hidden">
<div class="bg-gradient-to-r from-secondary-container to-[#00B0FF] h-full w-1/3 rounded-full"></div>
</div>
</div>
<!-- Selection Canvas -->
<div class="flex-grow px-lg pb-xl overflow-y-auto space-y-md">
<!-- Option 1: Selected State -->
<button class="w-full flex items-center p-md bg-surface-container-lowest border border-secondary-container rounded-lg shadow-[0_10px_30px_rgba(124,77,255,0.1)] relative group transition-all duration-200 text-left">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-secondary-container rounded-l-lg"></div>
<div class="w-12 h-12 rounded-full bg-secondary-fixed/50 flex items-center justify-center mr-md text-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">engineering</span>
</div>
<div class="flex-grow">
<h3 class="font-h3 text-body-lg text-primary mb-1">Engineering</h3>
<p class="font-body-md text-sm text-on-surface-variant">Building the future.</p>
</div>
<div class="text-secondary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
</button>
<!-- Option 2: Default State -->
<button class="w-full flex items-center p-md bg-surface-container-lowest border border-[#E8EAF6] rounded-lg hover:border-secondary-container/50 hover:shadow-[0_4px_20px_rgba(26,35,126,0.05)] transition-all duration-200 text-left group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-transparent group-hover:bg-secondary-container/30 rounded-l-lg transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mr-md text-on-surface-variant group-hover:text-secondary-container transition-colors">
<span class="material-symbols-outlined">science</span>
</div>
<div class="flex-grow">
<h3 class="font-h3 text-body-lg text-on-surface mb-1">Science</h3>
<p class="font-body-md text-sm text-on-surface-variant">Discovering the unknown.</p>
</div>
<div class="text-surface-container-high group-hover:text-secondary-container/50 transition-colors">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</button>
<!-- Option 3: Default State -->
<button class="w-full flex items-center p-md bg-surface-container-lowest border border-[#E8EAF6] rounded-lg hover:border-secondary-container/50 hover:shadow-[0_4px_20px_rgba(26,35,126,0.05)] transition-all duration-200 text-left group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-transparent group-hover:bg-secondary-container/30 rounded-l-lg transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mr-md text-on-surface-variant group-hover:text-secondary-container transition-colors">
<span class="material-symbols-outlined">palette</span>
</div>
<div class="flex-grow">
<h3 class="font-h3 text-body-lg text-on-surface mb-1">Arts</h3>
<p class="font-body-md text-sm text-on-surface-variant">Expressing creativity.</p>
</div>
<div class="text-surface-container-high group-hover:text-secondary-container/50 transition-colors">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</button>
<!-- Option 4: Default State -->
<button class="w-full flex items-center p-md bg-surface-container-lowest border border-[#E8EAF6] rounded-lg hover:border-secondary-container/50 hover:shadow-[0_4px_20px_rgba(26,35,126,0.05)] transition-all duration-200 text-left group">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-transparent group-hover:bg-secondary-container/30 rounded-l-lg transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-low flex items-center justify-center mr-md text-on-surface-variant group-hover:text-secondary-container transition-colors">
<span class="material-symbols-outlined">business_center</span>
</div>
<div class="flex-grow">
<h3 class="font-h3 text-body-lg text-on-surface mb-1">Business</h3>
<p class="font-body-md text-sm text-on-surface-variant">Managing the world.</p>
</div>
<div class="text-surface-container-high group-hover:text-secondary-container/50 transition-colors">
<span class="material-symbols-outlined">radio_button_unchecked</span>
</div>
</button>
</div>
<!-- Footer Action -->
<div class="p-lg bg-surface-container-lowest border-t border-surface-container-high mt-auto">
<button class="w-full py-md px-lg bg-secondary-container text-white font-button text-button rounded-lg shadow-md hover:bg-[#651fff] hover:shadow-lg transition-all duration-200 flex items-center justify-center">
                Continue
                <span class="material-symbols-outlined ml-sm text-sm">arrow_forward</span>
</button>
</div>
</main>
</body></html>
